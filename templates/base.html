{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Portfolio of {{ site_profile.full_name }}{% if site_profile.profession %}, {{ site_profile.profession }}{% endif %}.{% endblock %}">
  <title>{% block title %}{{ site_profile.full_name }}{% endblock %}</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'site.css' %}?v=4" rel="stylesheet" type="text/css">
  <link href="{% static 'fontawesome/css/all.min.css' %}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="site-body">
  <div class="site-shell">
    {% include 'includes/site_header.html' %}
    <main class="site-main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% include 'includes/site_footer.html' %}
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
